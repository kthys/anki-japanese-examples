name: Tests

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        # Pin pip version to prevent supply-chain attacks via pip itself
        python -m pip install --no-cache-dir pip==24.0
        # Install from locked requirements with exact versions
        pip install --no-cache-dir -r requirements-dev.lock

    - name: Verify dependency integrity
      run: |
        # Audit installed packages for known security vulnerabilities
        pip install --no-cache-dir pip-audit==2.7.2
        pip-audit --desc --skip-editable
      # Continue on audit failures to not block tests, but report issues
      continue-on-error: true

    - name: Test with unittest
      run: |
        python -m unittest discover tests/
